[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quid2pmi"
version = "0.1.0"
description = "Write Quiddity feature recognition results into a STEP file as AP242 PMI annotations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Paul Fremantle", email = "pzfreo@gmail.com" }]
requires-python = ">=3.10,<3.15"
dependencies = ["quiddity>=0.3", "build123d>=0.9,<0.12"]
keywords = ["cad", "step", "ap242", "pmi", "feature-recognition", "quiddity"]

[project.urls]
Repository = "https://github.com/pzfreo/quid2pmi"

[project.scripts]
quid2pmi = "quid2pmi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/quid2pmi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
# OCP, build123d and quiddity ship no type information.
module = ["OCP.*", "build123d.*", "quiddity.*"]
ignore_missing_imports = true
follow_imports = "skip"
